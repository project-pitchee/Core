plugins {
    id "com.android.application"
}

def ncnnInclude = System.getenv("PITCHEE_NCNN_INCLUDE_DIR")
def ncnnLibrary = System.getenv("PITCHEE_NCNN_LIBRARY")
def ncnnVulkan = System.getenv("PITCHEE_NCNN_VULKAN") ?: "OFF"
def coreDir = file("../../../..").absolutePath
def modelAssetDir = file("${projectDir}/src/main/assets/models")

tasks.register("syncPitcheeModels", Sync) {
    from("${coreDir}/models") {
        include "*.ncnn.param", "*.ncnn.bin", "manifest.json"
    }
    into(modelAssetDir)
}

preBuild.dependsOn("syncPitcheeModels")

android {
    namespace "space.pitchee.benchmark"
    compileSdk 36
    ndkVersion "26.3.11579264"

    defaultConfig {
        applicationId "space.pitchee.benchmark"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"
        ndk {
            abiFilters "arm64-v8a"
        }
        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
                arguments \
                    "-DPITCHEE_CORE_DIR=${coreDir}",
                    "-DPITCHEE_NCNN_INCLUDE_DIR=${ncnnInclude}",
                    "-DPITCHEE_NCNN_LIBRARY=${ncnnLibrary}",
                    "-DPITCHEE_NCNN_VULKAN=${ncnnVulkan}"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ["src/main/jniLibs"]
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
            excludes += ["**/libonnxruntime.so", "**/libonnxruntime4j_jni.so"]
        }
    }
}
